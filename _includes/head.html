<script>
  /* theme + interface language, before first paint */
  (function () {
    var d = document.documentElement;
    try {
      var t = localStorage.getItem('theme');
      if (t === 'dark' || t === 'light') d.setAttribute('data-theme', t);
    } catch (e) {}
    var ui = 'tr';
    try {
      var u = localStorage.getItem('ui');
      if (u === 'tr' || u === 'en') ui = u;
      else if (!(navigator.language || '').toLowerCase().startsWith('tr')) ui = 'en';
    } catch (e) {}
    d.setAttribute('data-ui', ui);
    d.setAttribute('lang', ui);
  })();
</script>
