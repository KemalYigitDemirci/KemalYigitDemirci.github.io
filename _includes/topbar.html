<header class="topbar">
  <div class="wrap">
    <a class="sig" href="/">
      <span class="glyph" aria-hidden="true"></span>
      <span class="full">{{ site.author.short | default: site.title }}</span>
    </a>

    <nav class="topnav" aria-label="Menu">
      <ul>
        <li><a href="/posts/" {% if page.nav == 'posts' %}aria-current="page"{% endif %}><span class="tr">Yazılar</span><span class="en">Writing</span></a></li>
        <li><a href="/projects/" {% if page.nav == 'projects' %}aria-current="page"{% endif %}><span class="tr">Projeler</span><span class="en">Projects</span></a></li>
        <li><a href="/library/" {% if page.nav == 'library' %}aria-current="page"{% endif %}><span class="tr">Kütüphane</span><span class="en">Library</span></a></li>
        <li><a href="/about/" {% if page.nav == 'about' %}aria-current="page"{% endif %}><span class="tr">Hakkında</span><span class="en">About</span></a></li>
      </ul>
    </nav>

    <div class="tools">
      <button class="tool" id="lang-toggle" type="button" aria-label="Türkçe / English">
        <span class="tr">EN</span><span class="en">TR</span>
      </button>
      <button class="tool" id="theme-toggle" type="button" aria-label="Light / dark">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4" stroke-linecap="round"/>
        </svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M20 14.3A8.2 8.2 0 1 1 9.7 4a6.6 6.6 0 0 0 10.3 10.3Z" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>
</header>
